<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antonio Bernal de Celis · Portfolio musical</title>
<meta name="description" content="Compositor de música para videojuegos.">
<meta name="theme-color" content="#463F3A">

<!-- Aplica el modo claro/oscuro guardado antes de pintar (evita parpadeo) -->
<script>try{var t=localStorage.getItem('site-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>

<!-- Si toca mostrar la bienvenida, la activa y quita el scroll desde el primer instante -->
<script>(function(){var h=location.hash,e=null;try{e=sessionStorage.getItem('entered');}catch(x){}if((!h||h==='#'||h==='#/')&&!e)document.documentElement.className+=' locked splash-on';})();</script>

<!-- ============================================================
     TIPOGRAFÍA  ·  Cambia aquí la URL de Google Fonts
     y después los nombres de familia en css/theme.css
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;600&display=swap" rel="stylesheet">

<link rel="preconnect" href="https://i.ytimg.com">

<!-- Estilos -->
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/main.css">

<!-- Scripts (defer: no bloquean la carga) -->
<script src="js/data.js" defer></script>
<script src="js/app.js" defer></script>
</head>

<body>

<a class="skip" href="#main" id="skipLink">Saltar al contenido</a>


<!-- ============================================================
     PANTALLA DE BIENVENIDA
     ============================================================ -->
<div class="splash" id="splash" hidden>
  <div class="splash-staff" aria-hidden="true">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="none">
      <line x1="0" y1="330" x2="1600" y2="330"/>
      <line x1="0" y1="390" x2="1600" y2="390"/>
      <line x1="0" y1="450" x2="1600" y2="450"/>
      <line x1="0" y1="510" x2="1600" y2="510"/>
      <line x1="0" y1="570" x2="1600" y2="570"/>
    </svg>
  </div>
  <div class="splash-inner">
    <h1 class="splash-name" id="splashName" data-bind="siteName"></h1>
    <p class="splash-tag" data-bind="tagline"></p>
    <p class="splash-welcome">Bienvenido/a a la página web oficial. Pulsa acceder para entrar.</p>
    <button class="btn btn-solid" id="splashEnter" type="button">Acceder</button>
  </div>
</div>


<!-- Cortina de transición entre páginas -->
<div class="curtain" id="curtain" aria-hidden="true"></div>


<!-- ============================================================
     CABECERA
     ============================================================ -->
<header class="site-header" id="siteHeader">
  <div class="wrap header-row">

    <a href="#/principal" class="brand">
      <span data-bind="siteName"></span>
    </a>

    <nav class="main-nav" id="mainNav" aria-label="Principal">
      <ul>
        <li><a href="#/principal" data-nav="principal">Principal</a></li>
        <li class="has-sub">
          <a href="#/musica" data-nav="musica">Música<span class="caret" aria-hidden="true"></span></a>
          <ul class="sub" id="navSub"></ul>
        </li>
        <li><a href="#/contacto" data-nav="contacto">Contacto</a></li>
      </ul>
    </nav>

    <div class="header-tools">
      <button class="icon-btn theme-toggle" id="themeToggle" type="button" aria-label="Cambiar modo claro u oscuro">
        <svg class="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn nav-toggle" id="navToggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="mainNav">
        <span></span><span></span>
      </button>
    </div>

  </div>
</header>


<!-- ============================================================
     CONTENIDO (lo pinta js/app.js según la sección)
     ============================================================ -->
<main id="main" class="view" tabindex="-1"></main>


<!-- ============================================================
     PIE
     ============================================================ -->
<footer class="site-footer">
  <div class="wrap">
    <div class="footer-top">
      <div data-reveal>
        <p class="footer-brand" data-bind="siteName"></p>
        <p class="footer-tag" data-bind="tagline"></p>
      </div>
      <div data-reveal style="--d:.1s">
        <h2>Música</h2>
        <ul id="footerCats"></ul>
      </div>
      <div data-reveal style="--d:.2s">
        <h2>Contacto</h2>
        <ul id="footerSocials"></ul>
      </div>
    </div>
    <div class="footer-bottom">
      <small>© <span id="year"></span> <span data-bind="siteName"></span></small>
      <small>Portfolio musical</small>
    </div>
  </div>
</footer>

<button class="to-top" id="toTop" type="button" aria-label="Volver arriba">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

</body>
</html>
